    # ((NOT OriginalFileName=* AND CommandLine="*.exe tunnel") OR (ParentCommandLine="* tunnel" AND Image="*\\cmd.exe" AND (CommandLine="*/d /c *" AND CommandLine="*\\servers\\Stable-*" AND CommandLine="*code-server.cmd*")) OR ((CommandLine="*.exe tunnel*" AND CommandLine="*--accept-server-license-terms*")))
