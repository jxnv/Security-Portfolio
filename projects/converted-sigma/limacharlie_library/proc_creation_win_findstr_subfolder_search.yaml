# Description: Detects execution of findstr with the "s" and "i" flags for a "subfolder" and "insensitive" search respectively. Attackers sometimes leverage this built-in utility to search the system for interesting files or filter through results of commands.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Insensitive Subfolder Search Via Findstr.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*findstr*") OR (Image="*findstr.exe") OR (OriginalFileName="FINDSTR.EXE")) AND ((CommandLine="* -i *") AND (CommandLine="* -s *")))
respond:
  - action: report
    name: Insensitive Subfolder Search Via Findstr.EXE

