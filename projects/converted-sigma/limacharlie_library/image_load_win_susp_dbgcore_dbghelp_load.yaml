# Title: Suspicious Loading of Dbgcore/Dbghelp DLLs from Uncommon Location
# ID: 416bc4a2-7217-4519-8dc7-c3271817f1d5
# Status: experimental
# Level: high
# Author: Swachchhanda Shrawan Poudel (Nextron Systems)
# Date: 2025-11-27
# Tags: attack.credential-access, attack.defense-impairment, attack.t1003, attack.t1685
# Description: Detects loading of dbgcore.dll or dbghelp.dll from uncommon locations such as user directories.
# These DLLs contain the MiniDumpWriteDump function, which can be abused for credential dumping purposes or in some cases for evading EDR/AV detection by suspending processes.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Suspicious Loading of Dbgcore/Dbghelp DLLs from Uncommon Location
detect:
  event: image_load
  op: and
  rules:
    # Filter logic:
    # (((ImageLoaded="*\\dbgcore.dll" OR ImageLoaded="*\\dbghelp.dll")) AND ((Image="*:\\Perflogs\\*" OR Image="*:\\Temp\\*" OR Image="*:\\Users\\Public\\*" OR Image="*\\$Recycle.Bin\\*" OR Image="*\\Contacts\\*" OR Image="*\\Documents\\*" OR Image="*\\Favorites\\*" OR Image="*\\Favourites\\*" OR Image="*\\inetpub\\wwwroot\\*" OR Image="*\\Music\\*" OR Image="*\\Pictures\\*" OR Image="*\\Start Menu\\Programs\\Startup\\*" OR Image="*\\Users\\Default\\*" OR Image="*\\Videos\\*")))
respond:
  - action: report
    name: Suspicious Loading of Dbgcore/Dbghelp DLLs from Uncommon Location

