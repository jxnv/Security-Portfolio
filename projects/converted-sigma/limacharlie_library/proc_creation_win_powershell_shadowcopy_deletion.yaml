# LimaCharlie Detection & Response Rule
# Name: Deletion of Volume Shadow Copies via WMI with PowerShell
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*.Delete()*" OR CommandLine="*Remove-WmiObject*" OR CommandLine="*rwmi*" OR CommandLine="*Remove-CimInstance*" OR CommandLine="*rcim*")) AND ((CommandLine="*Get-WmiObject*" OR CommandLine="*gwmi*" OR CommandLine="*Get-CimInstance*" OR CommandLine="*gcim*")) AND (CommandLine="*Win32_ShadowCopy*"))
respond:
  - action: report
    name: Deletion of Volume Shadow Copies via WMI with PowerShell

