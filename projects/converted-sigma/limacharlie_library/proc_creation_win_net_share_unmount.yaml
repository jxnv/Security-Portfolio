# LimaCharlie Detection & Response Rule
# Name: Unmount Share Via Net.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*share*" AND CommandLine="*/delete*")) AND (((Image="*\\net.exe" OR Image="*\\net1.exe")) OR ((OriginalFileName="net.exe" OR OriginalFileName="net1.exe"))))
respond:
  - action: report
    name: Unmount Share Via Net.EXE

