# Description: Detects a Chromium based browser process with the 'load-extension' flag to start a instance with a custom extension
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Chromium Browser Instance Executed With Custom Extension
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((Image="*\\brave.exe" OR Image="*\\chrome.exe" OR Image="*\\msedge.exe" OR Image="*\\opera.exe" OR Image="*\\vivaldi.exe") AND CommandLine="*--load-extension=*")
respond:
  - action: report
    name: Chromium Browser Instance Executed With Custom Extension

