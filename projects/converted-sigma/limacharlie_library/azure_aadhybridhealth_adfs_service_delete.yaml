# Status: test
# Level: medium
# Author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
# Date: 2021-08-26
# Tags: attack.defense-impairment, attack.t1578.003
# Description: This detection uses azureactivity logs (Administrative category) to identify the deletion of an Azure AD Hybrid health AD FS service instance in a tenant.
# A threat actor can create a new AD Health ADFS service and create a fake server to spoof AD FS signing logs.
# The health AD FS service can then be deleted after it is not longer needed via HTTP requests to Azure.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Azure Active Directory Hybrid Health AD FS Service Delete
detect:
  event: NEW_PROCESS
  op: and
  rules:
    # Filter logic:
    # (CategoryValue="Administrative" AND ResourceProviderValue="Microsoft.ADHybridHealthService" AND ResourceId="*AdFederationService*" AND OperationNameValue="Microsoft.ADHybridHealthService/services/delete")
respond:
  - action: report
    name: Azure Active Directory Hybrid Health AD FS Service Delete

