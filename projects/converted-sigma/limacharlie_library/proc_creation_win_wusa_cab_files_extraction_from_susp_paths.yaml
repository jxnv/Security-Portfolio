# Tags: attack.execution
# Description: Detects the execution of the "wusa.exe" (Windows Update Standalone Installer) utility to extract ".cab" files using the "/extract" argument from potentially suspicious paths.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Cab File Extraction Via Wusa.EXE From Potentially Suspicious Paths
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*:\\PerfLogs\\*" OR CommandLine="*:\\Users\\Public\\*" OR CommandLine="*:\\Windows\\Temp\\*" OR CommandLine="*\\Appdata\\Local\\Temp\\*")) AND (Image="*\\wusa.exe" AND CommandLine="*/extract:*"))
respond:
  - action: report
    name: Cab File Extraction Via Wusa.EXE From Potentially Suspicious Paths

