# Status: test
# Level: medium
# Author: Nasreddine Bencherchali (Nextron Systems)
# Date: 2023-01-26
# Tags: attack.execution, attack.stealth, attack.t1218, attack.t1202
# Description: Detects uncommon or suspicious child processes spawning from a VsCode "code.exe" process. This could indicate an attempt of persistence via VsCode tasks or terminal profiles.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Potentially Suspicious Child Process Of VsCode
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((ParentImage="*\\code.exe") AND (((Image="*\\powershell.exe" OR Image="*\\pwsh.exe" OR Image="*\\cmd.exe") AND (CommandLine="*Invoke-Expressions*" OR CommandLine="*IEX*" OR CommandLine="*Invoke-Command*" OR CommandLine="*ICM*" OR CommandLine="*DownloadString*" OR CommandLine="*rundll32*" OR CommandLine="*regsvr32*" OR CommandLine="*wscript*" OR CommandLine="*cscript*")) OR ((Image="*\\calc.exe" OR Image="*\\regsvr32.exe" OR Image="*\\rundll32.exe" OR Image="*\\cscript.exe" OR Image="*\\wscript.exe")) OR ((Image="*:\\Users\\Public\\*" OR Image="*:\\Windows\\Temp\\*" OR Image="*:\\Temp\\*"))))
respond:
  - action: report
    name: Potentially Suspicious Child Process Of VsCode

