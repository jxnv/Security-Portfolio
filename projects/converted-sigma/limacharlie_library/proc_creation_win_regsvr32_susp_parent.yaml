# Title: Scripting/CommandLine Process Spawned Regsvr32
# ID: ab37a6ec-6068-432b-a64e-2c7bf95b1d22
# Status: test
# Level: medium
# Author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
# Date: 2023-05-26
# Tags: attack.stealth, attack.t1218.010
# Description: Detects various command line and scripting engines/processes such as "PowerShell", "Wscript", "Cmd", etc. spawning a "regsvr32" instance.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Scripting/CommandLine Process Spawned Regsvr32
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((ParentImage="*\\cmd.exe" OR ParentImage="*\\cscript.exe" OR ParentImage="*\\mshta.exe" OR ParentImage="*\\powershell_ise.exe" OR ParentImage="*\\powershell.exe" OR ParentImage="*\\pwsh.exe" OR ParentImage="*\\wscript.exe") AND Image="*\\regsvr32.exe") AND NOT ((ParentImage="C:\\Windows\\System32\\cmd.exe" AND CommandLine="* /s C:\\Windows\\System32\\RpcProxy\\RpcProxy.dll")))
respond:
  - action: report
    name: Scripting/CommandLine Process Spawned Regsvr32

