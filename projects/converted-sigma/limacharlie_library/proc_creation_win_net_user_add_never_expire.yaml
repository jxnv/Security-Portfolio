# LimaCharlie Detection & Response Rule
# Name: New User Created Via Net.EXE With Never Expire Option
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*user*" AND CommandLine="*add*" AND CommandLine="*expires:never*")) AND (((Image="*\\net.exe" OR Image="*\\net1.exe")) OR ((OriginalFileName="net.exe" OR OriginalFileName="net1.exe"))))
respond:
  - action: report
    name: New User Created Via Net.EXE With Never Expire Option

