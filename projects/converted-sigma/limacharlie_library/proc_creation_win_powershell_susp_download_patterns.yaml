# LimaCharlie Detection & Response Rule
# Name: Suspicious PowerShell Download and Execute Pattern
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((CommandLine="*IEX ((New-Object Net.WebClient).DownloadString*" OR CommandLine="*IEX (New-Object Net.WebClient).DownloadString*" OR CommandLine="*IEX((New-Object Net.WebClient).DownloadString*" OR CommandLine="*IEX(New-Object Net.WebClient).DownloadString*" OR CommandLine="* -command (New-Object System.Net.WebClient).DownloadFile(*" OR CommandLine="* -c (New-Object System.Net.WebClient).DownloadFile(*"))
respond:
  - action: report
    name: Suspicious PowerShell Download and Execute Pattern

