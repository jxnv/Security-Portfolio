# LimaCharlie Detection & Response Rule
# Name: Shell Execution via Find - Linux
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*/bin/bash*" OR CommandLine="*/bin/dash*" OR CommandLine="*/bin/fish*" OR CommandLine="*/bin/sh*" OR CommandLine="*/bin/zsh*")) AND (Image="*/find" AND (CommandLine="* . *" AND CommandLine="*-exec*")))
respond:
  - action: report
    name: Shell Execution via Find - Linux

