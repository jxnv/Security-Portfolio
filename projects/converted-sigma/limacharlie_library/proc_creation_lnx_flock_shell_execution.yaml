# Description: Detects the use of the "flock" command to execute a shell. Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Shell Execution via Flock - Linux
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*/bin/bash*" OR CommandLine="*/bin/dash*" OR CommandLine="*/bin/fish*" OR CommandLine="*/bin/sh*" OR CommandLine="*/bin/zsh*")) AND (Image="*/flock" AND CommandLine="* -u *"))
respond:
  - action: report
    name: Shell Execution via Flock - Linux

