# Description: Detects when adversaries stop services or processes by deleting their respective scheduled tasks in order to conduct data destructive activities
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Delete Important Scheduled Task
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*/delete*" OR CommandLine="*-delete*")) AND ((CommandLine="*\\Windows\\BitLocker*" OR CommandLine="*\\Windows\\ExploitGuard*" OR CommandLine="*\\Windows\\SystemRestore\\SR*" OR CommandLine="*\\Windows\\UpdateOrchestrator\\*" OR CommandLine="*\\Windows\\Windows Defender\\*" OR CommandLine="*\\Windows\\WindowsBackup\\*" OR CommandLine="*\\Windows\\WindowsUpdate\\*")) AND ((Image="*\\schtasks.exe") OR (OriginalFileName="schtasks.exe")))
respond:
  - action: report
    name: Delete Important Scheduled Task

