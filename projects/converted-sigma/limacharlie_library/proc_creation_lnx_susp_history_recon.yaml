# LimaCharlie Detection & Response Rule
# Name: Print History File Contents
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((Image="*/cat" OR Image="*/head" OR Image="*/tail" OR Image="*/more")) AND (((CommandLine="*/.bash_history*" OR CommandLine="*/.zsh_history*")) OR ((CommandLine="*_history" OR CommandLine="*.history" OR CommandLine="*zhistory"))))
respond:
  - action: report
    name: Print History File Contents

