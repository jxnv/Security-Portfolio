# Tags: attack.discovery, attack.t1033
# Description: Detects usage of the Get-ADUser cmdlet to collect user information and output it to a file
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: User Discovery And Export Via Get-ADUser Cmdlet
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*Get-ADUser *" AND CommandLine="* -Filter \\**") AND (CommandLine="* > *" OR CommandLine="* | Select *" OR CommandLine="*Out-File*" OR CommandLine="*Set-Content*" OR CommandLine="*Add-Content*")) AND (((Image="*\\powershell.exe" OR Image="*\\pwsh.exe")) OR ((OriginalFileName="PowerShell.EXE" OR OriginalFileName="pwsh.dll"))))
respond:
  - action: report
    name: User Discovery And Export Via Get-ADUser Cmdlet

