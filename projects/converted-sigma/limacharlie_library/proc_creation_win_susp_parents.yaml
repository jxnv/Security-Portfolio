# LimaCharlie Detection & Response Rule
# Name: Suspicious Process Parents
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((ParentImage="*\\minesweeper.exe" OR ParentImage="*\\winver.exe" OR ParentImage="*\\bitsadmin.exe")) OR (((ParentImage="*\\csrss.exe" OR ParentImage="*\\certutil.exe" OR ParentImage="*\\eventvwr.exe" OR ParentImage="*\\calc.exe" OR ParentImage="*\\notepad.exe")) AND NOT (((NOT Image=*) OR ((Image="*\\WerFault.exe" OR Image="*\\wermgr.exe" OR Image="*\\conhost.exe" OR Image="*\\mmc.exe" OR Image="*\\win32calc.exe" OR Image="*\\notepad.exe"))))))
respond:
  - action: report
    name: Suspicious Process Parents

