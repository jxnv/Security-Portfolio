# LimaCharlie Detection & Response Rule
# Name: Automated Collection Command Prompt
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*.doc*" OR CommandLine="*.docx*" OR CommandLine="*.xls*" OR CommandLine="*.xlsx*" OR CommandLine="*.ppt*" OR CommandLine="*.pptx*" OR CommandLine="*.rtf*" OR CommandLine="*.pdf*" OR CommandLine="*.txt*")) AND (((CommandLine="*dir *" AND CommandLine="* /b *" AND CommandLine="* /s *")) OR (OriginalFileName="FINDSTR.EXE" AND (CommandLine="* /e *" OR CommandLine="* /si *"))))
respond:
  - action: report
    name: Automated Collection Command Prompt

