# LimaCharlie Detection & Response Rule
# Name: Registry Modification Attempt Via VBScript
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((CommandLine="*CreateObject*" AND CommandLine="*Wscript.shell*" AND CommandLine="*.RegWrite*"))
respond:
  - action: report
    name: Registry Modification Attempt Via VBScript

