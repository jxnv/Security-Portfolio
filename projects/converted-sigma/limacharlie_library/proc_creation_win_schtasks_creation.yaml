detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((Image="*\\schtasks.exe" AND CommandLine="* /create *") AND NOT (((User="*AUTHORI*" OR User="*AUTORI*"))) AND NOT (((ParentImage="C:\\Program Files\\Microsoft Office\\root\\integration\\integrator.exe" OR ParentImage="C:\\Program Files (x86)\\Microsoft Office\\root\\integration\\integrator.exe") AND (Image="C:\\Windows\\System32\\schtasks.exe" OR Image="C:\\Windows\\SysWOW64\\schtasks.exe") AND CommandLine="*Microsoft\\Office\\Office Performance Monitor*")))
respond:
  - action: report
    name: Scheduled Task Creation Via Schtasks.EXE

