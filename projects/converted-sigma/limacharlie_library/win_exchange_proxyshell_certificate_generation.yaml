# LimaCharlie Detection & Response Rule
# Name: Certificate Request Export to Exchange Webserver
detect:
  event: NEW_PROCESS
  op: and
  rules:
    # Filter logic:
    # (((="New-ExchangeCertificate" AND =" -GenerateRequest" AND =" -BinaryEncoded" AND =" -RequestFile")) AND ("\\\\\\\\localhost\\\\C$" OR "\\\\\\\\127.0.0.1\\\\C$" OR "C:\\\\inetpub" OR ".aspx"))
respond:
  - action: report
    name: Certificate Request Export to Exchange Webserver

