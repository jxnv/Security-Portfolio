# Description: Detects potentially suspicious child processes launched via the ScreenConnect client service.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Remote Access Tool - ScreenConnect Potential Suspicious Remote Command Execution
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((ParentCommandLine="*:\\Windows\\TEMP\\ScreenConnect\\*" AND ParentCommandLine="*run.cmd*") AND (Image="*\\bitsadmin.exe" OR Image="*\\cmd.exe" OR Image="*\\curl.exe" OR Image="*\\dllhost.exe" OR Image="*\\net.exe" OR Image="*\\nltest.exe" OR Image="*\\powershell.exe" OR Image="*\\pwsh.exe" OR Image="*\\rundll32.exe" OR Image="*\\wevtutil.exe"))
respond:
  - action: report
    name: Remote Access Tool - ScreenConnect Potential Suspicious Remote Command Execution

