# Title: Suspicious Encoded PowerShell Command Line
# ID: ca2092a1-c273-4878-9b4b-0d60115bf5ea
# Status: test
# Level: high
# Author: Florian Roth (Nextron Systems), Markus Neis, Jonhnathan Ribeiro, Daniil Yugoslavskiy, Anton Kutepov, oscd.community
# Date: 2018-09-03
# Tags: attack.execution, attack.t1059.001
# Description: Detects suspicious powershell process starts with base64 encoded commands (e.g. Emotet)
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Suspicious Encoded PowerShell Command Line
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((((Image="*\\powershell.exe" OR Image="*\\pwsh.exe")) OR ((OriginalFileName="PowerShell.EXE" OR OriginalFileName="pwsh.dll"))) AND ((((CommandLine="* JAB*" OR CommandLine="* SUVYI*" OR CommandLine="* SQBFAFgA*" OR CommandLine="* aQBlAHgA*" OR CommandLine="* aWV4I*" OR CommandLine="* IAA*" OR CommandLine="* IAB*" OR CommandLine="* UwB*" OR CommandLine="* cwB*")) AND (CommandLine="* -e*")) OR ((CommandLine="*.exe -ENCOD *" OR CommandLine="* BA^J e-*"))) AND NOT ((CommandLine="* -ExecutionPolicy remotesigned *")))
respond:
  - action: report
    name: Suspicious Encoded PowerShell Command Line

