# Description: Detects execution of "reg.exe" to disable security services such as Windows Defender.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Security Service Disabled Via Reg.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*d 4*" AND CommandLine="*v Start*") AND (CommandLine="*\\AppIDSvc*" OR CommandLine="*\\MsMpSvc*" OR CommandLine="*\\NisSrv*" OR CommandLine="*\\SecurityHealthService*" OR CommandLine="*\\Sense*" OR CommandLine="*\\UsoSvc*" OR CommandLine="*\\WdBoot*" OR CommandLine="*\\WdFilter*" OR CommandLine="*\\WdNisDrv*" OR CommandLine="*\\WdNisSvc*" OR CommandLine="*\\WinDefend*" OR CommandLine="*\\wscsvc*" OR CommandLine="*\\wuauserv*")) AND ((CommandLine="*reg*" AND CommandLine="*add*")))
respond:
  - action: report
    name: Security Service Disabled Via Reg.EXE

