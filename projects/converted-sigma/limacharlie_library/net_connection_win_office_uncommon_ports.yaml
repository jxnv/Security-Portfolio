# Description: Detects an office suit application (Word, Excel, PowerPoint, Outlook) communicating to target systems over uncommon ports.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Office Application Initiated Network Connection Over Uncommon Ports
detect:
  event: network_connection
  op: and
  rules:
    # Filter logic:
    # ((Initiated="true" AND (Image="*\\excel.exe" OR Image="*\\outlook.exe" OR Image="*\\powerpnt.exe" OR Image="*\\winword.exe" OR Image="*\\wordview.exe")) AND NOT ((((DestinationPort="53" OR DestinationPort="80" OR DestinationPort="139" OR DestinationPort="389" OR DestinationPort="443" OR DestinationPort="445" OR DestinationPort="3268")) OR (Image="*:\\Program Files\\Microsoft Office\\*" AND Image="*\\OUTLOOK.EXE" AND (DestinationPort="143" OR DestinationPort="465" OR DestinationPort="587" OR DestinationPort="993" OR DestinationPort="995")))))
respond:
  - action: report
    name: Office Application Initiated Network Connection Over Uncommon Ports

