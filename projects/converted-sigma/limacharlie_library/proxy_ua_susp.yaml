# Status: test
# Level: high
# Author: Florian Roth (Nextron Systems)
# Date: 2017-07-08
# Tags: attack.command-and-control, attack.t1071.001
# Description: Detects suspicious malformed user agent strings in proxy logs
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Suspicious User Agent
detect:
  event: proxy
  op: and
  rules:
    # Filter logic:
    # ((((c-useragent="user-agent*" OR c-useragent="Mozilla/3.0 *" OR c-useragent="Mozilla/2.0 *" OR c-useragent="Mozilla/1.0 *" OR c-useragent="Mozilla *" OR c-useragent=" Mozilla/*" OR c-useragent="Mozila/*" OR c-useragent="Mozilla/4.0 (compatible; MSIE 6.0; MS Web Services Client Protocol*")) OR ((c-useragent="* (compatible;MSIE *" OR c-useragent="*.0;Windows NT *" OR c-useragent="*loader*")) OR ((c-useragent="_" OR c-useragent="CertUtil URL Agent" OR c-useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:60.0)" OR c-useragent="Mozilla/5.0 (Windows NT 6.3; WOW64; rv:28.0) Gecko/20100101 Firefox/28.0" OR c-useragent="HTTPS" OR c-useragent="Erbium-UA-4ce7c27cb4be9d32e333bf032c88235a" OR c-useragent="x" OR c-useragent="xxx"))) AND NOT (((c-useragent="Mozilla/3.0 * Acrobat *") OR ((cs-host="*.acrobat.com" OR cs-host="*.adobe.com" OR cs-host="*.adobe.io")))))
respond:
  - action: report
    name: Suspicious User Agent

