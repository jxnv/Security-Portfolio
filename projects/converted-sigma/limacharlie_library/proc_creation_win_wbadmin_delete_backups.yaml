# Title: Windows Backup Deleted Via Wbadmin.EXE
# ID: 89f75308-5b1b-4390-b2d8-d6b2340efaf8
# Status: test
# Level: medium
# Author: frack113, Nasreddine Bencherchali (Nextron Systems)
# Date: 2021-12-13
# Tags: attack.impact, attack.t1490
# Description: Detects the deletion of backups or system state backups via "wbadmin.exe".
# This technique is used by numerous ransomware families and actors.
# This may only be successful on server platforms that have Windows Backup enabled.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Windows Backup Deleted Via Wbadmin.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((((CommandLine="*delete *" AND CommandLine="*backup*")) AND ((Image="*\\wbadmin.exe") OR (OriginalFileName="WBADMIN.EXE"))) AND NOT ((CommandLine="*keepVersions:0*")))
respond:
  - action: report
    name: Windows Backup Deleted Via Wbadmin.EXE

