# Title: Access To Windows DPAPI Master Keys By Uncommon Applications
# ID: 46612ae6-86be-4802-bc07-39b59feb1309
# Status: test
# Level: medium
# Author: Nasreddine Bencherchali (Nextron Systems)
# Date: 2022-10-17
# Tags: attack.credential-access, attack.t1555.004
# Description: Detects file access requests to the the Windows Data Protection API Master keys by an uncommon application.
# This can be a sign of credential stealing. Example case would be usage of mimikatz "dpapi::masterkey" function
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Access To Windows DPAPI Master Keys By Uncommon Applications
detect:
  event: file_access
  op: and
  rules:
    # Filter logic:
    # (((FileName="*\\Microsoft\\Protect\\S-1-5-18\\*" OR FileName="*\\Microsoft\\Protect\\S-1-5-21-*")) AND NOT (((Image="C:\\Windows\\explorer.exe") OR ((Image="C:\\Program Files\\*" OR Image="C:\\Program Files (x86)\\*" OR Image="C:\\Windows\\system32\\*" OR Image="C:\\Windows\\SysWOW64\\*")))))
respond:
  - action: report
    name: Access To Windows DPAPI Master Keys By Uncommon Applications

