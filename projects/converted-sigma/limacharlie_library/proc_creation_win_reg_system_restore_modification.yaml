# Title: System Restore Registry Modification via CommandLine
# ID: 7c06ab9b-b1d2-4ba9-b06e-09491ded20d9
# Status: experimental
# Level: high
# Author: Swachchhanda Shrawan Poudel (Nextron Systems)
# Date: 2026-03-11
# Tags: attack.impact, attack.t1490
# Description: Detects system restore registry modification via command line, which can be used by adversaries to disable system restore on the computer.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: System Restore Registry Modification via CommandLine
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="* add *" OR CommandLine="*Set-ItemProperty*" OR CommandLine="*New-ItemProperty*")) AND ((CommandLine="*DisableConfig*" OR CommandLine="*DisableSR*")) AND ((CommandLine="*\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\SystemRestore*" OR CommandLine="*\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\SystemRestore*")) AND (((Image="*\\powershell.exe" OR Image="*\\pwsh.exe" OR Image="*\\reg.exe")) OR ((OriginalFileName="powershell.exe" OR OriginalFileName="pwsh.dll" OR OriginalFileName="reg.exe"))))
respond:
  - action: report
    name: System Restore Registry Modification via CommandLine

