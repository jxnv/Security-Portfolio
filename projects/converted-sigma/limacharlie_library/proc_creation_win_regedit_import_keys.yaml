# Description: Detects the import of the specified file to the registry with regedit.exe.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Imports Registry Key From a File
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((((CommandLine="* /i *" OR CommandLine="* /s *" OR CommandLine="*.reg*")) AND ((Image="*\\regedit.exe") OR (OriginalFileName="REGEDIT.EXE"))) AND NOT ((((CommandLine="* -e *" OR CommandLine="* -a *" OR CommandLine="* -c *")) AND (CommandLine=regex(":[^ \\\\]")))))
respond:
  - action: report
    name: Imports Registry Key From a File

