# LimaCharlie Detection & Response Rule
# Name: File Download Via Bitsadmin To A Suspicious Target Folder
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="* /transfer *" OR CommandLine="* /create *" OR CommandLine="* /addfile *")) AND ((CommandLine="*:\\Perflogs*" OR CommandLine="*:\\ProgramData\\*" OR CommandLine="*:\\Temp\\*" OR CommandLine="*:\\Users\\Public\\*" OR CommandLine="*:\\Windows\\*" OR CommandLine="*\\$Recycle.Bin\\*" OR CommandLine="*\\AppData\\Local\\*" OR CommandLine="*\\AppData\\Roaming\\*" OR CommandLine="*\\Contacts\\*" OR CommandLine="*\\Desktop\\*" OR CommandLine="*\\Favorites\\*" OR CommandLine="*\\Favourites\\*" OR CommandLine="*\\inetpub\\wwwroot\\*" OR CommandLine="*\\Music\\*" OR CommandLine="*\\Pictures\\*" OR CommandLine="*\\Start Menu\\Programs\\Startup\\*" OR CommandLine="*\\Users\\Default\\*" OR CommandLine="*\\Videos\\*" OR CommandLine="*%ProgramData%*" OR CommandLine="*%public%*" OR CommandLine="*%temp%*" OR CommandLine="*%tmp%*")) AND ((Image="*\\bitsadmin.exe") OR (OriginalFileName="bitsadmin.exe")))
respond:
  - action: report
    name: File Download Via Bitsadmin To A Suspicious Target Folder

