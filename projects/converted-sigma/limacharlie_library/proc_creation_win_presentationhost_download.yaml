# LimaCharlie Detection & Response Rule
# Name: Arbitrary File Download Via PresentationHost.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*http://*" OR CommandLine="*https://*" OR CommandLine="*ftp://*")) AND ((Image="*\\presentationhost.exe") OR (OriginalFileName="PresentationHost.exe")))
respond:
  - action: report
    name: Arbitrary File Download Via PresentationHost.EXE

