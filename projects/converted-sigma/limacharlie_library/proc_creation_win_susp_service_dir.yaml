# Description: Detects a service binary running in a suspicious directory
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Suspicious Service Binary Directory
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((Image="*\\Users\\Public\\*" OR Image="*\\$Recycle.bin*" OR Image="*\\Users\\All Users\\*" OR Image="*\\Users\\Default\\*" OR Image="*\\Users\\Contacts\\*" OR Image="*\\Users\\Searches\\*" OR Image="*C:\\Perflogs\\*" OR Image="*\\config\\systemprofile\\*" OR Image="*\\Windows\\Fonts\\*" OR Image="*\\Windows\\IME\\*" OR Image="*\\Windows\\addins\\*") AND (ParentImage="*\\services.exe" OR ParentImage="*\\svchost.exe"))
respond:
  - action: report
    name: Suspicious Service Binary Directory

