# LimaCharlie Detection & Response Rule
# Name: Windows Share Mount Via Net.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="* use *" OR CommandLine="* \\\\\\\\*")) AND (((Image="*\\net.exe" OR Image="*\\net1.exe")) OR ((OriginalFileName="net.exe" OR OriginalFileName="net1.exe"))))
respond:
  - action: report
    name: Windows Share Mount Via Net.EXE

