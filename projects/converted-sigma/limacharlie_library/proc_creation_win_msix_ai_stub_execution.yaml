# Title: Windows MSIX Package Support Framework AI_STUBS Execution
# ID: af5732ed-764e-489d-826d-0447c8b36242
# Status: experimental
# Level: low
# Author: Michael Haag, Swachchhanda Shrawan Poudel (Nextron Systems)
# Date: 2025-11-03
# Tags: attack.execution, attack.stealth, attack.defense-impairment, attack.t1218, attack.t1553.005, attack.t1204.002
# Description: Detects execution of Advanced Installer MSIX Package Support Framework (PSF) components, specifically AI_STUBS executables with original filename 'popupwrapper.exe'.
# This activity may indicate malicious MSIX packages build with Advanced Installer leveraging the Package Support Framework to bypass application control restrictions.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Windows MSIX Package Support Framework AI_STUBS Execution
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((Image="*\\AI_STUBS\\AiStubX64Elevated.exe" OR Image="*\\AI_STUBS\\AiStubX86Elevated.exe" OR Image="*\\AI_STUBS\\AiStubX64.exe" OR Image="*\\AI_STUBS\\AiStubX86.exe") AND OriginalFileName="popupwrapper.exe")
respond:
  - action: report
    name: Windows MSIX Package Support Framework AI_STUBS Execution

