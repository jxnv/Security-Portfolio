# LimaCharlie Detection & Response Rule
# Name: Hidden User Creation
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((Image="*/dscl" AND CommandLine="*create*") AND (CommandLine="*UniqueID*" AND CommandLine=regex("([0-9]|[1-9][0-9]|[1-4][0-9]{2})"))) OR ((Image="*/dscl" AND CommandLine="*create*") AND ((CommandLine="*IsHidden*") AND ((CommandLine="*true*" OR CommandLine="*yes*" OR CommandLine="*1*")))))
respond:
  - action: report
    name: Hidden User Creation

