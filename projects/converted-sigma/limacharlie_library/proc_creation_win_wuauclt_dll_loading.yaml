# LimaCharlie Detection & Response Rule
# Name: Proxy Execution Via Wuauclt.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((((CommandLine="*UpdateDeploymentProvider*" AND CommandLine="*RunHandlerComServer*")) AND ((Image="*\\wuauclt.exe") OR (OriginalFileName="wuauclt.exe"))) AND NOT (((CommandLine="* /UpdateDeploymentProvider UpdateDeploymentProvider.dll *") OR ((CommandLine="*:\\Windows\\UUS\\Packages\\Preview\\amd64\\updatedeploy.dll /ClassId*" OR CommandLine="*:\\Windows\\UUS\\amd64\\UpdateDeploy.dll /ClassId*")) OR ((CommandLine="*:\\Windows\\WinSxS\\*" AND CommandLine="*\\UpdateDeploy.dll /ClassId *")) OR (CommandLine="* wuaueng.dll *"))))
respond:
  - action: report
    name: Proxy Execution Via Wuauclt.EXE

