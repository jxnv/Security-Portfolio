# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Potential Suspicious Windows Feature Enabled
detect:
  event: ps_script
  op: and
  rules:
    # Filter logic:
    # (((ScriptBlockText="*Enable-WindowsOptionalFeature*" AND ScriptBlockText="*-Online*" AND ScriptBlockText="*-FeatureName*")) AND ((ScriptBlockText="*TelnetServer*" OR ScriptBlockText="*Internet-Explorer-Optional-amd64*" OR ScriptBlockText="*TFTP*" OR ScriptBlockText="*SMB1Protocol*" OR ScriptBlockText="*Client-ProjFS*" OR ScriptBlockText="*Microsoft-Windows-Subsystem-Linux*")))
respond:
  - action: report
    name: Potential Suspicious Windows Feature Enabled

