# Description: Detects registry modifications that add Windows Filtering Platform (WFP) filters, which may be used to block security tools and EDR agents from reporting events.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: WFP Filter Added via Registry
detect:
  event: registry_set
  op: and
  rules:
    # Filter logic:
    # ((TargetObject="*\\BFE\\Parameters\\Policy\\Persistent\\Filter\\*") AND NOT (((Image="C:\\Windows\\System32\\svchost.exe" OR Image="C:\\Windows\\SysWOW64\\svchost.exe"))))
respond:
  - action: report
    name: WFP Filter Added via Registry

