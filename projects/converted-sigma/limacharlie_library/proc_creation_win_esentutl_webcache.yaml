# LimaCharlie Detection & Response Rule
# Name: Esentutl Steals Browser Information
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*-r*" OR CommandLine="*/r*")) AND ((Image="*\\esentutl.exe") OR (OriginalFileName="esentutl.exe")) AND (CommandLine="*\\Windows\\WebCache*"))
respond:
  - action: report
    name: Esentutl Steals Browser Information

