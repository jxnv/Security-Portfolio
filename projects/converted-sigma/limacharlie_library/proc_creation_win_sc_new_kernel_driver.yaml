# Status: test
# Level: medium
# Author: Nasreddine Bencherchali (Nextron Systems)
# Date: 2022-07-14
# Tags: attack.persistence, attack.privilege-escalation, attack.t1543.003
# Description: Detects creation of a new service (kernel driver) with the type "kernel"
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: New Kernel Driver Via SC.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((Image="*\\sc.exe" AND (CommandLine="*create*" OR CommandLine="*config*") AND (CommandLine="*binPath*" AND CommandLine="*type*" AND CommandLine="*kernel*")) AND NOT ((((CommandLine="*create netprotection_network_filter*" AND CommandLine="*type= kernel start= *" AND CommandLine="*binPath= System32\\drivers\\netprotection_network_filter*" AND CommandLine="*DisplayName= netprotection_network_filter*" AND CommandLine="*group= PNP_TDI tag= yes*")) OR ((CommandLine="*create avelam binpath=C:\\Windows\\system32\\drivers\\avelam.sys*" AND CommandLine="*type=kernel start=boot error=critical group=Early-Launch*")))))
respond:
  - action: report
    name: New Kernel Driver Via SC.EXE

