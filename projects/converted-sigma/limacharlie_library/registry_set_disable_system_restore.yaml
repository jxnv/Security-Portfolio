# LimaCharlie Detection & Response Rule
# Name: Registry Disable System Restore
detect:
  event: registry_set
  op: and
  rules:
    # Filter logic:
    # ((TargetObject="*\\Policies\\Microsoft\\Windows NT\\SystemRestore*" OR TargetObject="*\\Microsoft\\Windows NT\\CurrentVersion\\SystemRestore*") AND (TargetObject="*DisableConfig" OR TargetObject="*DisableSR") AND Details="DWORD (0x00000001)")
respond:
  - action: report
    name: Registry Disable System Restore

