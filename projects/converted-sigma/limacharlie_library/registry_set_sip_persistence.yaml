# LimaCharlie Detection & Response Rule
# Name: Persistence Via New SIP Provider
detect:
  event: registry_set
  op: and
  rules:
    # Filter logic:
    # ((((TargetObject="*\\Dll*" OR TargetObject="*\\$DLL*")) AND ((TargetObject="*\\SOFTWARE\\Microsoft\\Cryptography\\Providers\\*" OR TargetObject="*\\SOFTWARE\\Microsoft\\Cryptography\\OID\\EncodingType*" OR TargetObject="*\\SOFTWARE\\WOW6432Node\\Microsoft\\Cryptography\\Providers\\*" OR TargetObject="*\\SOFTWARE\\WOW6432Node\\Microsoft\\Cryptography\\OID\\EncodingType*"))) AND NOT ((((Details="WINTRUST.DLL" OR Details="mso.dll")) OR (Image="C:\\Windows\\System32\\poqexec.exe" AND TargetObject="*\\CryptSIPDll*" AND Details="C:\\Windows\\System32\\PsfSip.dll"))))
respond:
  - action: report
    name: Persistence Via New SIP Provider

