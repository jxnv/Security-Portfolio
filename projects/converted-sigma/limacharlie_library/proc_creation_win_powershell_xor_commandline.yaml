# Author: Sami Ruohonen, Harish Segar, Tim Shelton, Teymur Kheirkhabarov, Vasiliy Burov, oscd.community, Nasreddine Bencherchali
# Date: 2018-09-05
# Tags: attack.execution, attack.stealth, attack.t1059.001, attack.t1140, attack.t1027
# Description: Detects presence of a potentially xor encoded powershell command
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Suspicious XOR Encoded PowerShell Command
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*ForEach*" OR CommandLine="*for(*" OR CommandLine="*for *" OR CommandLine="*-join *" OR CommandLine="*-join'*" OR CommandLine="*-join\"*" OR CommandLine="*-join`*" OR CommandLine="*::Join*" OR CommandLine="*[char]*")) AND (CommandLine="*bxor*") AND (((Image="*\\powershell.exe" OR Image="*\\pwsh.exe")) OR ((OriginalFileName="PowerShell.EXE" OR OriginalFileName="pwsh.dll")) OR (Description="Windows PowerShell") OR (Product="PowerShell Core 6")))
respond:
  - action: report
    name: Suspicious XOR Encoded PowerShell Command

