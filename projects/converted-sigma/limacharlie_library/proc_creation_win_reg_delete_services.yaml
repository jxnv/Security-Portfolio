# LimaCharlie Detection & Response Rule
# Name: Service Registry Key Deleted Via Reg.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((CommandLine="* delete *") AND ((Image="*reg.exe") OR (OriginalFileName="reg.exe")) AND (CommandLine="*\\SYSTEM\\CurrentControlSet\\services\\*"))
respond:
  - action: report
    name: Service Registry Key Deleted Via Reg.EXE

