# Title: Set Suspicious Files as System Files Using Attrib.EXE
# ID: efec536f-72e8-4656-8960-5e85d091345b
# Status: test
# Level: high
# Author: Nasreddine Bencherchali (Nextron Systems)
# Date: 2022-06-28
# Tags: attack.stealth, attack.t1564.001
# Description: Detects the usage of attrib with the "+s" option to set scripts or executables located in suspicious locations as system files to hide them from users and make them unable to be deleted with simple rights. The rule limits the search to specific extensions and directories to avoid FPs
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Set Suspicious Files as System Files Using Attrib.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="* +s*") AND ((CommandLine="*.bat*" OR CommandLine="*.dll*" OR CommandLine="*.exe*" OR CommandLine="*.hta*" OR CommandLine="*.ps1*" OR CommandLine="*.vbe*" OR CommandLine="*.vbs*")) AND ((Image="*\\attrib.exe") OR (OriginalFileName="ATTRIB.EXE")) AND ((CommandLine="* %*" OR CommandLine="*\\Users\\Public\\*" OR CommandLine="*\\AppData\\Local\\*" OR CommandLine="*\\ProgramData\\*" OR CommandLine="*\\Downloads\\*" OR CommandLine="*\\Windows\\Temp\\*"))) AND NOT (((CommandLine="*\\Windows\\TEMP\\*" AND CommandLine="*.exe*"))))
respond:
  - action: report
    name: Set Suspicious Files as System Files Using Attrib.EXE

