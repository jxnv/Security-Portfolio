# Title: Suspicious DNS Query for IP Lookup Service APIs
# ID: ec82e2a5-81ea-4211-a1f8-37a0286df2c2
# Status: test
# Level: medium
# Author: Brandon George (blog post), Thomas Patzke
# Date: 2021-07-08
# Tags: attack.reconnaissance, attack.t1590
# Description: Detects DNS queries for IP lookup services such as "api.ipify.org" originating from a non browser process.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Suspicious DNS Query for IP Lookup Service APIs
detect:
  event: dns_query
  op: and
  rules:
    # Filter logic:
    # ((((QueryName="www.ip.cn" OR QueryName="l2.io")) OR ((QueryName="*api.2ip.ua*" OR QueryName="*api.bigdatacloud.net*" OR QueryName="*api.ipify.org*" OR QueryName="*bot.whatismyipaddress.com*" OR QueryName="*canireachthe.net*" OR QueryName="*checkip.amazonaws.com*" OR QueryName="*checkip.dyndns.org*" OR QueryName="*curlmyip.com*" OR QueryName="*db-ip.com*" OR QueryName="*edns.ip-api.com*" OR QueryName="*eth0.me*" OR QueryName="*freegeoip.app*" OR QueryName="*geoipy.com*" OR QueryName="*getip.pro*" OR QueryName="*icanhazip.com*" OR QueryName="*ident.me*" OR QueryName="*ifconfig.io*" OR QueryName="*ifconfig.me*" OR QueryName="*ip-api.com*" OR QueryName="*ip.360.cn*" OR QueryName="*ip.anysrc.net*" OR QueryName="*ip.taobao.com*" OR QueryName="*ip.tyk.nu*" OR QueryName="*ipaddressworld.com*" OR QueryName="*ipapi.co*" OR QueryName="*ipconfig.io*" OR QueryName="*ipecho.net*" OR QueryName="*ipinfo.io*" OR QueryName="*ipip.net*" OR QueryName="*ipof.in*" OR QueryName="*ipv4.icanhazip.com*" OR QueryName="*ipv4bot.whatismyipaddress.com*" OR QueryName="*ipv6-test.com*" OR QueryName="*ipwho.is*" OR QueryName="*jsonip.com*" OR QueryName="*myexternalip.com*" OR QueryName="*seeip.org*" OR QueryName="*wgetip.com*" OR QueryName="*whatismyip.akamai.com*" OR QueryName="*whois.pconline.com.cn*" OR QueryName="*wtfismyip.com*"))) AND NOT (((Image="*\\brave.exe") OR ((Image="C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe" OR Image="C:\\Program Files (x86)\\Google\\Chrome\\Application\\chrome.exe")) OR ((Image="C:\\Program Files (x86)\\Microsoft\\EdgeWebView\\Application\\*") OR (Image="*\\WindowsApps\\MicrosoftEdge.exe") OR ((Image="C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe" OR Image="C:\\Program Files\\Microsoft\\Edge\\Application\\msedge.exe"))) OR ((Image="C:\\Program Files (x86)\\Microsoft\\EdgeCore\\*" OR Image="C:\\Program Files\\Microsoft\\EdgeCore\\*") AND (Image="*\\msedge.exe" OR Image="*\\msedgewebview2.exe")) OR ((Image="C:\\Program Files\\Mozilla Firefox\\firefox.exe" OR Image="C:\\Program Files (x86)\\Mozilla Firefox\\firefox.exe")) OR ((Image="C:\\Program Files (x86)\\Internet Explorer\\iexplore.exe" OR Image="C:\\Program Files\\Internet Explorer\\iexplore.exe")) OR (Image="*\\maxthon.exe") OR (Image="*\\opera.exe") OR (Image="*\\safari.exe") OR (Image="*\\seamonkey.exe") OR (Image="*\\vivaldi.exe") OR (Image="*\\whale.exe"))))
respond:
  - action: report
    name: Suspicious DNS Query for IP Lookup Service APIs

