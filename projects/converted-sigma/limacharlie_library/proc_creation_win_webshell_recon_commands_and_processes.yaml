# Date: 2017-01-01
# Tags: attack.persistence, attack.discovery, attack.t1505.003, attack.t1018, attack.t1033, attack.t1087
# Description: Detects certain command line parameters often used during reconnaissance activity via web shells
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Webshell Detection With Command Line Keywords
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((((ParentImage="*\\java.exe" OR ParentImage="*\\javaw.exe") AND (ParentImage="*-tomcat-*" OR ParentImage="*\\tomcat*")) OR ((ParentImage="*\\java.exe" OR ParentImage="*\\javaw.exe") AND (CommandLine="*catalina.jar*" OR CommandLine="*CATALINA_HOME*")) OR ((ParentImage="*\\w3wp.exe" OR ParentImage="*\\php-cgi.exe" OR ParentImage="*\\nginx.exe" OR ParentImage="*\\httpd.exe" OR ParentImage="*\\caddy.exe" OR ParentImage="*\\ws_tomcatservice.exe"))) AND (((CommandLine="*&cd&echo*" OR CommandLine="*cd /d *")) OR (((Image="*\\dsquery.exe" OR Image="*\\find.exe" OR Image="*\\findstr.exe" OR Image="*\\ipconfig.exe" OR Image="*\\netstat.exe" OR Image="*\\nslookup.exe" OR Image="*\\pathping.exe" OR Image="*\\quser.exe" OR Image="*\\schtasks.exe" OR Image="*\\systeminfo.exe" OR Image="*\\tasklist.exe" OR Image="*\\tracert.exe" OR Image="*\\wevtutil.exe" OR Image="*\\whoami.exe")) OR ((OriginalFileName="dsquery.exe" OR OriginalFileName="find.exe" OR OriginalFileName="findstr.exe" OR OriginalFileName="ipconfig.exe" OR OriginalFileName="netstat.exe" OR OriginalFileName="nslookup.exe" OR OriginalFileName="pathping.exe" OR OriginalFileName="quser.exe" OR OriginalFileName="schtasks.exe" OR OriginalFileName="sysinfo.exe" OR OriginalFileName="tasklist.exe" OR OriginalFileName="tracert.exe" OR OriginalFileName="VSSADMIN.EXE" OR OriginalFileName="wevtutil.exe" OR OriginalFileName="whoami.exe"))) OR ((CommandLine="* Test-NetConnection *" OR CommandLine="*dir \\*")) OR ((OriginalFileName="net.exe" OR OriginalFileName="net1.exe") AND (CommandLine="* user *" OR CommandLine="* use *" OR CommandLine="* group *")) OR (OriginalFileName="ping.exe" AND CommandLine="* -n *") OR ((Image="*\\cmd.exe" OR Image="*\\powershell.exe" OR Image="*\\pwsh.exe") AND (CommandLine="* -enc *" OR CommandLine="* -EncodedCommand *" OR CommandLine="* -w hidden *" OR CommandLine="* -windowstyle hidden*" OR CommandLine="*.WebClient).Download*")) OR (OriginalFileName="wmic.exe" AND CommandLine="* /node:*")))
respond:
  - action: report
    name: Webshell Detection With Command Line Keywords

