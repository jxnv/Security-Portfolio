# Tags: attack.credential-access, attack.t1558.003
# Description: Detects the use of RemoteKrbRelay, a Kerberos relaying tool via CommandLine flags and PE metadata.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: HackTool - RemoteKrbRelay Execution
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((Image="*\\RemoteKrbRelay.exe") OR (OriginalFileName="RemoteKrbRelay.exe")) OR ((CommandLine="* -clsid *" AND CommandLine="* -target *" AND CommandLine="* -victim *")) OR ((CommandLine="*-rbcd *") AND ((CommandLine="*-cn *" OR CommandLine="*--computername *"))) OR (CommandLine="*-chp *" AND (CommandLine="*-chpPass *" AND CommandLine="*-chpUser *")) OR ((CommandLine="*-addgroupmember *" AND CommandLine="*-group *" AND CommandLine="*-groupuser *")) OR ((CommandLine="*-smb *" AND CommandLine="*--smbkeyword *") AND (CommandLine="*interactive*" OR CommandLine="*secrets*" OR CommandLine="*service-add*")))
respond:
  - action: report
    name: HackTool - RemoteKrbRelay Execution

