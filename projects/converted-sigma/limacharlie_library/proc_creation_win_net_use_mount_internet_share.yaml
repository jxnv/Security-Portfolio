# Tags: attack.lateral-movement, attack.t1021.002
# Description: Detects when an internet hosted webdav share is mounted using the "net.exe" utility
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Windows Internet Hosted WebDav Share Mount Via Net.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="* use *" AND CommandLine="* http*")) AND (((Image="*\\net.exe" OR Image="*\\net1.exe")) OR ((OriginalFileName="net.exe" OR OriginalFileName="net1.exe"))))
respond:
  - action: report
    name: Windows Internet Hosted WebDav Share Mount Via Net.EXE

