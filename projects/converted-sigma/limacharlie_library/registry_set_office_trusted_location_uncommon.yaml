# Author: Nasreddine Bencherchali (Nextron Systems)
# Date: 2023-06-21
# Tags: attack.persistence, attack.defense-impairment, attack.t1112
# Description: Detects changes to registry keys related to "Trusted Location" of Microsoft Office where the path is set to something uncommon. Attackers might add additional trusted locations to avoid macro security restrictions.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Uncommon Microsoft Office Trusted Location Added
detect:
  event: registry_set
  op: and
  rules:
    # Filter logic:
    # ((TargetObject="*Security\\Trusted Locations\\Location*" AND TargetObject="*\\Path") AND NOT ((((Image="*:\\Program Files\\Microsoft Office\\*" OR Image="*:\\Program Files (x86)\\Microsoft Office\\*")) OR (Image="*:\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\*" AND Image="*\\OfficeClickToRun.exe"))) AND NOT (((Details="*%APPDATA%\\Microsoft\\Templates*" OR Details="*%%APPDATA%%\\Microsoft\\Templates*" OR Details="*%APPDATA%\\Microsoft\\Word\\Startup*" OR Details="*%%APPDATA%%\\Microsoft\\Word\\Startup*" OR Details="*:\\Program Files (x86)\\Microsoft Office\\root\\Templates\\*" OR Details="*:\\Program Files\\Microsoft Office (x86)\\Templates*" OR Details="*:\\Program Files\\Microsoft Office\\root\\Templates\\*" OR Details="*:\\Program Files\\Microsoft Office\\Templates\\*"))))
respond:
  - action: report
    name: Uncommon Microsoft Office Trusted Location Added

