# Title: Potentially Suspicious Wuauclt Network Connection
# ID: c649a6c7-cd8c-4a78-9c04-000fc76df954
# Status: test
# Level: medium
# Author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
# Date: 2020-10-12
# Tags: attack.stealth, attack.t1218
# Description: Detects the use of the Windows Update Client binary (wuauclt.exe) to proxy execute code and making network connections.
# One could easily make the DLL spawn a new process and inject to it to proxy the network connection and bypass this rule.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Potentially Suspicious Wuauclt Network Connection
detect:
  event: network_connection
  op: and
  rules:
    # Filter logic:
    # ((Image="*wuauclt*" AND CommandLine="* /RunHandlerComServer*") AND NOT (((CommandLine="") OR (NOT CommandLine=*) OR ((cidrmatch("127.0.0.0/8", DestinationIp) OR cidrmatch("10.0.0.0/8", DestinationIp) OR cidrmatch("169.254.0.0/16", DestinationIp) OR cidrmatch("172.16.0.0/12", DestinationIp) OR cidrmatch("192.168.0.0/16", DestinationIp) OR cidrmatch("::1/128", DestinationIp) OR cidrmatch("fe80::/10", DestinationIp) OR cidrmatch("fc00::/7", DestinationIp))) OR ((cidrmatch("20.184.0.0/13", DestinationIp) OR cidrmatch("20.192.0.0/10", DestinationIp) OR cidrmatch("23.79.0.0/16", DestinationIp) OR cidrmatch("51.10.0.0/15", DestinationIp) OR cidrmatch("51.103.0.0/16", DestinationIp) OR cidrmatch("51.104.0.0/15", DestinationIp) OR cidrmatch("52.224.0.0/11", DestinationIp))) OR ((CommandLine="*:\\Windows\\UUS\\Packages\\Preview\\amd64\\updatedeploy.dll /ClassId*" OR CommandLine="*:\\Windows\\UUS\\amd64\\UpdateDeploy.dll /ClassId*")) OR ((CommandLine="*:\\Windows\\WinSxS\\*" AND CommandLine="*\\UpdateDeploy.dll /ClassId *")))))
respond:
  - action: report
    name: Potentially Suspicious Wuauclt Network Connection

