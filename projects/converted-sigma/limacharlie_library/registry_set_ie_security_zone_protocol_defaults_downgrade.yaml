# Title: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols
# ID: 3fd4c8d7-8362-4557-a8e6-83b29cc0d724
# Status: test
# Level: high
# Author: Nasreddine Bencherchali (Nextron Systems), Michael Haag (idea)
# Date: 2023-09-05
# Tags: attack.stealth
# Description: Detects changes to Internet Explorer's (IE / Windows Internet properties) ZoneMap configuration of the "HTTP" and "HTTPS" protocols to point to the "My Computer" zone. This allows downloaded files from the Internet to be granted the same level of trust as files stored locally.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols
detect:
  event: registry_set
  op: and
  rules:
    # Filter logic:
    # (TargetObject="*\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\\ZoneMap\\ProtocolDefaults*" AND (TargetObject="*\\http" OR TargetObject="*\\https") AND Details="*DWORD (0x00000000)*")
respond:
  - action: report
    name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols

