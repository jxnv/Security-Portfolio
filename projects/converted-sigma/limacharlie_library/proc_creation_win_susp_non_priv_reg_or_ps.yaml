# LimaCharlie Detection & Response Rule
# Name: Non-privileged Usage of Reg or Powershell
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((((CommandLine="*reg *" AND CommandLine="*add*")) OR ((CommandLine="*powershell*" OR CommandLine="*set-itemproperty*" OR CommandLine="* sp *" OR CommandLine="*new-itemproperty*"))) AND ((IntegrityLevel="Medium" OR IntegrityLevel="S-1-16-8192") AND (CommandLine="*ControlSet*" AND CommandLine="*Services*") AND (CommandLine="*ImagePath*" OR CommandLine="*FailureCommand*" OR CommandLine="*ServiceDLL*")))
respond:
  - action: report
    name: Non-privileged Usage of Reg or Powershell

