# LimaCharlie Detection & Response Rule
# Name: Execution of Powershell Script in Public Folder
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((Image="*\\powershell.exe" OR Image="*\\pwsh.exe") AND (CommandLine="*-f C:\\Users\\Public*" OR CommandLine="*-f \"C:\\Users\\Public*" OR CommandLine="*-f %Public%*" OR CommandLine="*-fi C:\\Users\\Public*" OR CommandLine="*-fi \"C:\\Users\\Public*" OR CommandLine="*-fi %Public%*" OR CommandLine="*-fil C:\\Users\\Public*" OR CommandLine="*-fil \"C:\\Users\\Public*" OR CommandLine="*-fil %Public%*" OR CommandLine="*-file C:\\Users\\Public*" OR CommandLine="*-file \"C:\\Users\\Public*" OR CommandLine="*-file %Public%*"))
respond:
  - action: report
    name: Execution of Powershell Script in Public Folder

