# Tags: attack.persistence, attack.execution, attack.stealth, attack.t1197, attack.s0190, attack.t1036.003, attack.command-and-control, attack.t1105
# Description: Detects usage of bitsadmin downloading a file from a suspicious domain
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Suspicious Download From File-Sharing Website Via Bitsadmin
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*.githubusercontent.com*" OR CommandLine="*0x0.st*" OR CommandLine="*anonfiles.com*" OR CommandLine="*bashupload.com*" OR CommandLine="*cdn.discordapp.com*" OR CommandLine="*chunk.io*" OR CommandLine="*ddns.net*" OR CommandLine="*dl.dropboxusercontent.com*" OR CommandLine="*ghostbin.co*" OR CommandLine="*github.com*" OR CommandLine="*glitch.me*" OR CommandLine="*gofile.io*" OR CommandLine="*hastebin.com*" OR CommandLine="*mediafire.com*" OR CommandLine="*mega.nz*" OR CommandLine="*onrender.com*" OR CommandLine="*pages.dev*" OR CommandLine="*paste.ee*" OR CommandLine="*pastebin.com*" OR CommandLine="*pastebin.pl*" OR CommandLine="*pastetext.net*" OR CommandLine="*privatlab.com*" OR CommandLine="*privatlab.net*" OR CommandLine="*send.exploit.in*" OR CommandLine="*sendspace.com*" OR CommandLine="*storage.googleapis.com*" OR CommandLine="*storjshare.io*" OR CommandLine="*supabase.co*" OR CommandLine="*temp.sh*" OR CommandLine="*transfer.sh*" OR CommandLine="*trycloudflare.com*" OR CommandLine="*ufile.io*" OR CommandLine="*w3spaces.com*" OR CommandLine="*workers.dev*" OR CommandLine="*x0.at*")) AND ((CommandLine="* /transfer *" OR CommandLine="* /create *" OR CommandLine="* /addfile *")) AND ((Image="*\\bitsadmin.exe") OR (OriginalFileName="bitsadmin.exe")))
respond:
  - action: report
    name: Suspicious Download From File-Sharing Website Via Bitsadmin

