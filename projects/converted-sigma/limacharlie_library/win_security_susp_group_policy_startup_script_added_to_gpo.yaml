# LimaCharlie Detection & Response Rule
# Name: Startup/Logon Script Added to Group Policy Object
detect:
  event: NEW_PROCESS
  op: and
  rules:
    # Filter logic:
    # (((EventID="5136" OR EventID="5145")) AND ((((AttributeLDAPDisplayName="gPCMachineExtensionNames" OR AttributeLDAPDisplayName="gPCUserExtensionNames") AND AttributeValue="*42B5FAAE-6536-11D2-AE5A-0000F87571E3*") AND ((AttributeValue="*40B6664F-4972-11D1-A7CA-0000F87571E3*" OR AttributeValue="*40B66650-4972-11D1-A7CA-0000F87571E3*"))) OR (ShareName="*\\SYSVOL" AND (RelativeTargetName="*\\scripts.ini" OR RelativeTargetName="*\\psscripts.ini") AND AccessList="*%%4417*")))
respond:
  - action: report
    name: Startup/Logon Script Added to Group Policy Object

