# Title: Local System Accounts Discovery - MacOs
# ID: ddf36b67-e872-4507-ab2e-46bda21b842c
# Status: test
# Level: low
# Author: Alejandro Ortuno, oscd.community
# Date: 2020-10-08
# Tags: attack.discovery, attack.t1087.001
# Description: Detects enumeration of local system accounts on MacOS systems.
# This can be used by attackers to identify accounts for lateral movement or privilege escalation.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Local System Accounts Discovery - MacOs
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((Image="*/dscacheutil" AND (CommandLine="*-q*" AND CommandLine="*user*")) OR (Image="*/dscl" AND (CommandLine="*list*" AND CommandLine="*/users*")) OR (Image="*/ls" AND (CommandLine="*/Users" OR CommandLine="*/Users'" OR CommandLine="*/Users\"")) OR (Image="*/id") OR ((Image="*/who" OR Image="*/w" OR Image="*/users" OR Image="*/last")) OR ((Image="*/defaults" OR Image="*/plutil") AND CommandLine="*com.apple.loginwindow*") OR (Image="*/lsof" AND CommandLine="*-u*") OR ((Image="*/cat" OR Image="*/awk" OR Image="*/grep") AND (CommandLine="*/etc/passwd*" OR CommandLine="*/etc/sudoers*")) OR (CommandLine="*'*:0:'*"))
respond:
  - action: report
    name: Local System Accounts Discovery - MacOs

