# Title: PowerShell Execution With Potential Decryption Capabilities
# ID: 434c08ba-8406-4d15-8b24-782cb071a691
# Status: test
# Level: high
# Author: X__Junior (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
# Date: 2023-06-30
# Tags: attack.execution
# Description: Detects PowerShell commands that decrypt an ".LNK" "file to drop the next stage of the malware.
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: PowerShell Execution With Potential Decryption Capabilities
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*Get-ChildItem *" OR CommandLine="*dir *" OR CommandLine="*gci *" OR CommandLine="*ls *")) AND ((CommandLine="*Get-Content *" OR CommandLine="*gc *" OR CommandLine="*cat *" OR CommandLine="*type *" OR CommandLine="*ReadAllBytes*")) AND (((CommandLine="* ^| *" AND CommandLine="*\\*.lnk*" AND CommandLine="*-Recurse*" AND CommandLine="*-Skip *")) OR ((CommandLine="* -ExpandProperty *" AND CommandLine="*\\*.lnk*" AND CommandLine="*WriteAllBytes*" AND CommandLine="* .length *"))) AND ((Image="*\\powershell.exe" OR Image="*\\pwsh.exe") AND (OriginalFileName="PowerShell.EXE" OR OriginalFileName="pwsh.dll")))
respond:
  - action: report
    name: PowerShell Execution With Potential Decryption Capabilities

