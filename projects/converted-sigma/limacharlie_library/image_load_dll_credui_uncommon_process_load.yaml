# Title: CredUI.DLL Loaded By Uncommon Process
# ID: 9ae01559-cf7e-4f8e-8e14-4c290a1b4784
# Status: test
# Level: medium
# Author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
# Date: 2020-10-20
# Tags: attack.credential-access, attack.collection, attack.t1056.002
# Description: Detects loading of "credui.dll" and related DLLs by an uncommon process. Attackers might leverage this DLL for potential use of "CredUIPromptForCredentials" or "CredUnPackAuthenticationBufferW".
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: CredUI.DLL Loaded By Uncommon Process
detect:
  event: image_load
  op: and
  rules:
    # Filter logic:
    # ((((ImageLoaded="*\\credui.dll" OR ImageLoaded="*\\wincredui.dll")) OR ((OriginalFileName="credui.dll" OR OriginalFileName="wincredui.dll"))) AND NOT ((((Image="C:\\Windows\\explorer.exe" OR Image="C:\\Windows\\ImmersiveControlPanel\\SystemSettings.exe" OR Image="C:\\Windows\\regedit.exe")) OR ((Image="C:\\Program Files (x86)\\*" OR Image="C:\\Program Files\\*" OR Image="C:\\Windows\\System32\\*" OR Image="C:\\Windows\\SysWOW64\\*" OR Image="C:\\Windows\\SystemApps\\*")))) AND NOT (((Image="C:\\Users\\*" AND Image="*\\AppData\\Local\\Microsoft\\OneDrive\\*") OR (Image="*\\opera_autoupdate.exe") OR ((Image="*\\procexp64.exe" OR Image="*\\procexp64a.exe" OR Image="*\\procexp.exe")) OR (Image="C:\\Users\\*" AND Image="*\\AppData\\Local\\Microsoft\\Teams\\*" AND Image="*\\Teams.exe"))))
respond:
  - action: report
    name: CredUI.DLL Loaded By Uncommon Process

