# LimaCharlie Detection & Response Rule
# Name: Suspicious PowerShell Invocations - Specific - ProcessCreation
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((((CommandLine="*-nop*" AND CommandLine="* -w *" AND CommandLine="*hidden*" AND CommandLine="* -c *" AND CommandLine="*[Convert]::FromBase64String*")) OR ((CommandLine="* -w *" AND CommandLine="*hidden*" AND CommandLine="*-ep*" AND CommandLine="*bypass*" AND CommandLine="*-Enc*")) OR ((CommandLine="* -w *" AND CommandLine="*hidden*" AND CommandLine="*-noni*" AND CommandLine="*-nop*" AND CommandLine="* -c *" AND CommandLine="*iex*" AND CommandLine="*New-Object*")) OR ((CommandLine="*iex*" AND CommandLine="*New-Object*" AND CommandLine="*Net.WebClient*" AND CommandLine="*.Download*")) OR ((CommandLine="*powershell*" AND CommandLine="*reg*" AND CommandLine="*add*" AND CommandLine="*\\software\\*")) OR ((CommandLine="*bypass*" AND CommandLine="*-noprofile*" AND CommandLine="*-windowstyle*" AND CommandLine="*hidden*" AND CommandLine="*new-object*" AND CommandLine="*system.net.webclient*" AND CommandLine="*.download*"))) AND NOT (((CommandLine="*(New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1*" OR CommandLine="*Write-ChocolateyWarning*"))))
respond:
  - action: report
    name: Suspicious PowerShell Invocations - Specific - ProcessCreation

