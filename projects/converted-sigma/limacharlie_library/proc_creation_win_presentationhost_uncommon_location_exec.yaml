# LimaCharlie Detection & Response Rule
# Name: XBAP Execution From Uncommon Locations Via PresentationHost.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*.xbap*") AND ((Image="*\\presentationhost.exe") OR (OriginalFileName="PresentationHost.exe"))) AND NOT (((CommandLine="* C:\\Windows\\*" OR CommandLine="* C:\\Program Files*"))))
respond:
  - action: report
    name: XBAP Execution From Uncommon Locations Via PresentationHost.EXE

