# LimaCharlie Detection & Response Rule
# Name: Service Started/Stopped Via Wmic.EXE
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="* service *" AND CommandLine="* call *") AND (CommandLine="*stopservice*" OR CommandLine="*startservice*")) AND ((OriginalFileName="wmic.exe") OR (Image="*\\WMIC.exe")))
respond:
  - action: report
    name: Service Started/Stopped Via Wmic.EXE

