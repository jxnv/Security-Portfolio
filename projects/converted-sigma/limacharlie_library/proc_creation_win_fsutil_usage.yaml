# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: Fsutil Suspicious Invocation
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # (((CommandLine="*deletejournal*" OR CommandLine="*createjournal*" OR CommandLine="*setZeroData*")) AND ((Image="*\\fsutil.exe") OR (OriginalFileName="fsutil.exe")))
respond:
  - action: report
    name: Fsutil Suspicious Invocation

