# LimaCharlie Detection & Response Rule
# Name: Potential Persistence Via DLLPathOverride
detect:
  event: registry_set
  op: and
  rules:
    # Filter logic:
    # ((TargetObject="*\\SYSTEM\\CurrentControlSet\\Control\\ContentIndex\\Language\\*") AND ((TargetObject="*\\StemmerDLLPathOverride*" OR TargetObject="*\\WBDLLPathOverride*" OR TargetObject="*\\StemmerClass*" OR TargetObject="*\\WBreakerClass*")))
respond:
  - action: report
    name: Potential Persistence Via DLLPathOverride

