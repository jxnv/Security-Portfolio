# Description: Detects PDQDeploy service installation on the target system.
# When a package is deployed via PDQDeploy it installs a remote service on the target machine with the name "PDQDeployRunner-X" where "X" is an integer starting from 1
# Converted by: Sigma Universal SIEM/EDR CLI

# LimaCharlie Detection & Response Rule
# Name: New PDQDeploy Service - Client Side
detect:
  event: NEW_PROCESS
  op: and
  rules:
    # Filter logic:
    # ((Provider_Name="Service Control Manager" AND EventID="7045") AND ((ImagePath="*PDQDeployRunner-*") OR (ServiceName="PDQDeployRunner-*")))
respond:
  - action: report
    name: New PDQDeploy Service - Client Side

