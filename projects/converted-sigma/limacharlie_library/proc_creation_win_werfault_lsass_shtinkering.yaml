# LimaCharlie Detection & Response Rule
# Name: Potential Credential Dumping Via WER
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((((ParentUser="*AUTHORI*" OR ParentUser="*AUTORI*") AND (User="*AUTHORI*" OR User="*AUTORI*") AND (CommandLine="* -u -p *" AND CommandLine="* -ip *" AND CommandLine="* -s *")) AND ((Image="*\\Werfault.exe") OR (OriginalFileName="WerFault.exe"))) AND NOT ((ParentImage="C:\\Windows\\System32\\lsass.exe")))
respond:
  - action: report
    name: Potential Credential Dumping Via WER

