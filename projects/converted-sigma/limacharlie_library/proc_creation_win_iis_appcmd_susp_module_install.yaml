# LimaCharlie Detection & Response Rule
# Name: IIS Native-Code Module Command Line Installation
detect:
  event: process_creation
  op: and
  rules:
    # Filter logic:
    # ((((CommandLine="*install*" AND CommandLine="*module*") AND (CommandLine="*-name:*" OR CommandLine="*/name:*")) AND ((Image="*\\appcmd.exe") OR (OriginalFileName="appcmd.exe"))) AND NOT ((ParentImage="C:\\Windows\\System32\\inetsrv\\iissetup.exe")))
respond:
  - action: report
    name: IIS Native-Code Module Command Line Installation

