    # (((Product="*AutoHotkey*") OR (Description="*AutoHotkey*") OR ((OriginalFileName="AutoHotkey.exe" OR OriginalFileName="AutoHotkey.rc"))) AND NOT ((((Image="*\\AutoHotkey.exe" OR Image="*\\AutoHotkey32.exe" OR Image="*\\AutoHotkey32_UIA.exe" OR Image="*\\AutoHotkey64.exe" OR Image="*\\AutoHotkey64_UIA.exe" OR Image="*\\AutoHotkeyA32.exe" OR Image="*\\AutoHotkeyA32_UIA.exe" OR Image="*\\AutoHotkeyU32.exe" OR Image="*\\AutoHotkeyU32_UIA.exe" OR Image="*\\AutoHotkeyU64.exe" OR Image="*\\AutoHotkeyU64_UIA.exe")) OR (Image="*\\AutoHotkey*"))))
respond:
  - action: report
    name: Renamed AutoHotkey.EXE Execution

